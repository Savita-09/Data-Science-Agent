services:
  - type: web
    name: data-science-agent-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_CONFIG
        value: /srv/autods/config.render.yaml
      - key: APP_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://data-science-agent-rosy.vercel.app
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
